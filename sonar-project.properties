# Configuración raíz de SonarQube (multi-módulo)
sonar.projectKey=interlockerup
sonar.projectName=InterLockerUp
sonar.projectVersion=1.0
sonar.modules=backend,frontend,interlockerup-admin

# Exclusiones globales
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/uploads/**,**/backups/**,*.zip,*.md,*.txt,*.sql,*.sh,*.html
